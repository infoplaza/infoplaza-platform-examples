// Schema of the Infoplaza Transit Planner API, vendored here so the example
// can decode the messages the planner streams back.
// https://platform.infoplaza.com/reference/v1-transit-plannermixer

syntax = "proto3";

import "PlanRequest.proto";
import "PlanResult.proto";

package planner.service;

service TripPlanner {
  rpc GetPlans(PlanRequest) returns (stream model.PlanResult);
  rpc GetPlan(PlanRequest) returns (model.PlanResult);
}