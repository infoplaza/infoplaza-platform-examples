// Schema of the Infoplaza Transit Planner API, vendored here so the example
// can decode the messages the planner streams back.
// https://platform.infoplaza.com/reference/v1-transit-plannermixer

syntax = "proto3";

package planner.model.enumerations;

option java_multiple_files = true;

enum TransitMode {
  AIR = 0;
  BUS = 2;
  CABLEWAY = 3;
  WATER = 4;
  FUNICULAR = 5;
  LIFT = 6;
  RAIL = 7;
  METRO = 8;
  TAXI = 9;
  TRAM = 10;
  TROLLEYBUS = 11;
  MONORAIL = 12;
  COACH = 13;

  //Leave room for future modes
  OTHER_TRANSIT_MODE = 99;
}

enum NonTransitMode {
  CAR = 0;
  BICYCLE = 1;
  SCOOTER = 2;
  WALK = 3;
  RENTED_BICYCLE = 4;
  RENTED_SCOOTER = 5;
  PUBLIC_STOP_TAXI = 6;

  // Flexible, on-demand transit. Still returns transit legs.
  FLEX = 7; // e.g. dial-a-ride, demand responsive transport
  //Leave room for future modes

  // Reserved for future use.
  OTHER_NON_TRANSIT_MODE = 99;
}